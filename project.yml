name: Laminat

packages:
  # Self-update (docs/IDEAS.md → Дистрибуция). Pinned; appcast is published with each GitHub release.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0

options:
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.5"
    CURRENT_PROJECT_VERSION: "9"
    # Prototype: ad-hoc signing ("Sign to Run Locally"), no Apple Developer account.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    # DuckDB C library, fetched by scripts/fetch-duckdb.sh into Vendor/duckdb.
    SWIFT_INCLUDE_PATHS: $(SRCROOT)/Vendor/CDuckDB
    LIBRARY_SEARCH_PATHS: $(SRCROOT)/Vendor/duckdb
    # Sparkle EdDSA public key; the private key lives in the login keychain (account "laminat") and in
    # the SPARKLE_PRIVATE_KEY GitHub secret.
    SPARKLE_PUBLIC_KEY: nbSjkLNIyysz5AoJ6FVvKVbUbHFdR261BzEi1zr/JrI=

targets:
  Laminat:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.priboy68rus.laminat
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Laminat
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSPrincipalClass: NSApplication
        CFBundleIconName: AppIcon
        # Sparkle: the appcast is attached to every GitHub release, so "latest/download" always points
        # at the newest one. Updates are verified with this EdDSA public key.
        SUFeedURL: https://github.com/priboy68rus/laminat/releases/latest/download/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: ""
        # .parquet has no system UTI, so the app declares (exports) one. Exported rather than imported:
        # Spotlight only runs an app's import extension for types the app owns.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: org.apache.parquet
            UTTypeDescription: Parquet file
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [parquet]
              public.mime-type: [application/vnd.apache.parquet]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Parquet file
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes: [org.apache.parquet]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).ParquetDocument
    dependencies:
      - target: LaminatQuickLook
        embed: true
      - target: LaminatThumbnail
        embed: true
      # LaminatSpotlight is built but not embedded yet: Spotlight never invokes it for real indexing
      # (see docs/SPEC.md §1.3).
      - framework: Vendor/duckdb/libduckdb.dylib
        embed: true
        codeSign: true
      - package: Sparkle

  LaminatQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - QuickLook
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.priboy68rus.laminat.QuickLook
        GENERATE_INFOPLIST_FILE: NO
        # Uses the libduckdb.dylib embedded in the host app's Frameworks.
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../../../../Frameworks"
    info:
      path: QuickLook/Info.plist
      properties:
        CFBundleDisplayName: Laminat Quick Look
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewProvider
          NSExtensionAttributes:
            QLIsDataBasedPreview: true
            QLSupportsSearchableItems: false
            QLSupportedContentTypes:
              - org.apache.parquet
    entitlements:
      path: QuickLook/LaminatQuickLook.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    dependencies:
      - sdk: QuickLookUI.framework
      - framework: Vendor/duckdb/libduckdb.dylib
        embed: false

  LaminatThumbnail:
    type: app-extension
    platform: macOS
    sources:
      - Thumbnail
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.priboy68rus.laminat.Thumbnail
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../../../../Frameworks"
    info:
      path: Thumbnail/Info.plist
      properties:
        CFBundleDisplayName: Laminat Thumbnail
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThumbnailProvider
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - org.apache.parquet
            QLThumbnailMinimumDimension: 16
    entitlements:
      path: Thumbnail/LaminatThumbnail.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    dependencies:
      - sdk: QuickLookThumbnailing.framework
      - framework: Vendor/duckdb/libduckdb.dylib
        embed: false

  LaminatSpotlight:
    type: app-extension
    platform: macOS
    sources:
      - Spotlight
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.priboy68rus.laminat.Spotlight
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../../../../Frameworks"
    info:
      path: Spotlight/Info.plist
      properties:
        CFBundleDisplayName: Laminat Spotlight
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.spotlight.import
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ImportExtension
          NSExtensionAttributes:
            CSSupportedContentTypes:
              - org.apache.parquet
    entitlements:
      path: Spotlight/LaminatSpotlight.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    dependencies:
      - sdk: CoreSpotlight.framework
      - framework: Vendor/duckdb/libduckdb.dylib
        embed: false

  # Developer tool: times the Quick Look preview and runs SQL. Not shipped.
  LaminatCLI:
    type: tool
    platform: macOS
    sources:
      - CLI
      - Shared
      - App/Data
    settings:
      base:
        PRODUCT_NAME: laminat-cli
        LD_RUNPATH_SEARCH_PATHS: $(SRCROOT)/Vendor/duckdb
    dependencies:
      - framework: Vendor/duckdb/libduckdb.dylib
        embed: false
