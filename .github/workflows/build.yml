name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          sw_vers
          brew install xcodegen

      - name: Package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="${GITHUB_SHA::7}"; fi
          set +e
          ./scripts/package.sh "$VERSION" 2>&1 | tee package.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ $status -ne 0 ]]; then
            # Surface compiler errors as annotations (readable without downloading logs).
            { grep -E "error:" package.log | sort -u | head -10; tail -15 package.log; } | while IFS= read -r line; do echo "::error::$line"; done
            exit $status
          fi
          echo "ZIP=dist/Laminat-$VERSION.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: Laminat
          path: ${{ env.ZIP }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ZIP" \
            --title "Laminat $GITHUB_REF_NAME" \
            --prerelease \
            --notes-file .github/release-notes.md
