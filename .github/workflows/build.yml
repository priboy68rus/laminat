name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # The macOS 26+ SDK is what gives the app the current system design (Liquid Glass); an older SDK
    # makes macOS show it in the legacy look.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          SDK=$(xcrun --sdk macosx --show-sdk-version)
          echo "::notice::$(xcodebuild -version | tr '\n' ' ') — macOS SDK $SDK ($XCODE)"
          if [[ "${SDK%%.*}" -lt 26 ]]; then
            echo "::error::macOS SDK $SDK is older than 26: the app would use the legacy design"
            exit 1
          fi
          brew install xcodegen

      - name: Package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="${GITHUB_SHA::7}"; fi
          set +e
          ./scripts/package.sh "$VERSION" 2>&1 | tee package.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ $status -ne 0 ]]; then
            # Surface compiler errors as annotations (readable without downloading logs).
            { grep -E "error:" package.log | sort -u | head -10; tail -15 package.log; } | while IFS= read -r line; do echo "::error::$line"; done
            exit $status
          fi
          echo "ZIP=dist/Laminat-$VERSION.zip" >> "$GITHUB_ENV"
          echo "DMG=dist/Laminat-$VERSION.dmg" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: Laminat
          path: |
            ${{ env.ZIP }}
            ${{ env.DMG }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          # Sparkle appcast for self-update, attached to the release next to the zip.
          ASSETS=("$DMG" "$ZIP")  # DMG for people, zip for Sparkle
          if [[ -n "$SPARKLE_PRIVATE_KEY" ]]; then
            ./scripts/make-appcast.sh "$ZIP" "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$(basename "$ZIP")"
            ASSETS+=(dist/appcast.xml)
          else
            echo "::warning::SPARKLE_PRIVATE_KEY secret is not set: release published without an appcast (no auto-update)"
          fi

          # Tags like v0.2.0-beta1 are pre-releases; plain versions become the latest release.
          PRERELEASE=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && PRERELEASE="--prerelease"
          gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" \
            --title "Laminat $GITHUB_REF_NAME" \
            $PRERELEASE \
            --notes-file .github/release-notes.md
